# Stack CryLog Hub — signaling, registro dispositivi, fan-out notifiche.
#
# Copiare questa cartella come nuovo stack in Docker-Compose-Stacks/crylog/.
# Il sidecar Tailscale espone l'Hub solo sulla tailnet: https://crylog.<tailnet>.ts.net
#
# Dati su Pool1000GB: registro dispositivi, token di pairing e log eventi non
# sono riproducibili.

services:
  tailscale-crylog:
    image: tailscale/tailscale:latest
    container_name: tailscale-crylog
    hostname: crylog
    env_file:
      - /mnt/Pool1000GB/Repos/Docker-Compose-Stacks/tailscale.env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - /mnt/Pool1000GB/CryLog/tailscale:/var/lib/tailscale
      - /mnt/Pool1000GB/Repos/Docker-Compose-Stacks/crylog/serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "30050:8080"
    healthcheck:
      test: ["CMD-SHELL", "tailscale serve status 2>/dev/null | grep -q 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  crylog-hub:
    build: .
    image: crylog-hub:latest
    container_name: crylog-hub
    network_mode: "service:tailscale-crylog"
    depends_on:
      tailscale-crylog:
        condition: service_healthy
    environment:
      - CRYLOG_PORT=8080
      - CRYLOG_DATA_DIR=/data
      # Token per creare i codici di pairing. Se assente viene generato al primo
      # avvio e stampato nei log (docker logs crylog-hub).
      # - CRYLOG_ADMIN_TOKEN=
      # Silenzio oltre il quale un Nursery Node e dichiarato offline.
      - CRYLOG_OFFLINE_AFTER_MS=90000
      # Fase 4 — chiave service account per l'invio delle push FCM.
      # Secret vero: mai nel repo, montato come volume di sola lettura.
      # - CRYLOG_FCM_CREDENTIALS=/run/secrets/fcm-service-account.json
    volumes:
      - /mnt/Pool1000GB/CryLog/data:/data
      # - /mnt/Pool1000GB/CryLog/secrets/fcm-service-account.json:/run/secrets/fcm-service-account.json:ro
    restart: unless-stopped
