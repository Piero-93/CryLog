# Stack CryLog Hub — signaling, registro dispositivi, fan-out notifiche.
#
# Il sidecar Tailscale espone l'Hub solo sulla tailnet: https://crylog.<tailnet>.ts.net
#
# I percorsi dei volumi sono relativi a questa cartella, cosi' `docker compose up`
# funziona su un clone appena fatto. Su un server vero: spostarli su un disco di
# cui si fa il backup, perche' registro dispositivi, token di pairing e log
# eventi non sono riproducibili.
#
# Serve un `tailscale.env` accanto a questo file, con dentro TS_AUTHKEY.

services:
  tailscale-crylog:
    image: tailscale/tailscale:latest
    container_name: tailscale-crylog
    hostname: crylog
    env_file:
      - ./tailscale.env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "30050:8080"
    healthcheck:
      test: ["CMD-SHELL", "tailscale serve status 2>/dev/null | grep -q 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  crylog-hub:
    # L'immagine viene dal registro, non da una copia del sorgente accanto allo
    # stack: era quella copia a far divergere le due cartelle a ogni modifica.
    # Il tag lo pubblica la workflow di release; `latest` segue l'ultimo.
    #
    # Finche' il repository e' privato lo e' anche il pacchetto, quindi
    # l'host deve essersi autenticato una volta:
    #   echo "$GITHUB_TOKEN" | docker login ghcr.io -u <utente> --password-stdin
    #
    # Per costruire in locale invece di scaricare, togliere `image:` e
    # rimettere `build: .` da questa cartella.
    image: ghcr.io/piero-93/crylog-hub:latest
    pull_policy: always
    container_name: crylog-hub
    network_mode: "service:tailscale-crylog"
    depends_on:
      tailscale-crylog:
        condition: service_healthy
    environment:
      - CRYLOG_PORT=8080
      - CRYLOG_DATA_DIR=/data
      # Token per creare i codici di pairing. Se assente viene generato al primo
      # avvio e stampato nei log (docker logs crylog-hub).
      # - CRYLOG_ADMIN_TOKEN=
      # Silenzio oltre il quale un Nursery Node e dichiarato offline.
      - CRYLOG_OFFLINE_AFTER_MS=90000
      # Fase 4 — chiave service account per l'invio delle push FCM.
      # Secret vero: mai nel repo, montato come volume di sola lettura.
      - CRYLOG_FCM_CREDENTIALS=/run/secrets/fcm-service-account.json
    volumes:
      - ./data:/data
      - ./secrets/fcm-service-account.json:/run/secrets/fcm-service-account.json:ro
    restart: unless-stopped
